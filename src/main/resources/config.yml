# Spawn Cape configuration

overworld-name: world
nether-name: world_nether

return:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5

# Any single axis outside this range returns the cape.
overworld-limit: 1000
nether-limit: 250

broadcast-interval-seconds: 300

reach-bonus: 1.0

# How the cape starts/keeps elytra flight without a chest elytra.
# force  = start/keep glide every tick (most reliable, can jitter)
# jump   = start like a real elytra (jump again in the air)
# assist = jump to start, plus a slow rescue if they are falling
glide-mode: force

discord-webhook: ""

# After a reboot/crash, the last holder can reclaim the cape this many seconds
# after the plugin enables and keep their current hold timer.
reboot-grace-seconds: 300

keepsake-name: "<gold>Spawn Cape Keepsake"

# Given every interval-seconds the current holder keeps the cape.
hold-reward:
  interval-seconds: 60
  amount: 2
  material: OBSIDIAN

item:
  name: "<gold><bold>Spawn Cape"
  material: ELYTRA
  glow: true

messages:
  prefix: "<dark_gray>[<gold>Spawn Cape</gold>]</dark_gray> "
  broadcast: "<player> has the fabled Spawn Cape and is at <x>, <y>, <z> in <world>. They have held it for <duration>. Type <yellow>/cape off</yellow> to hide these messages."
  location-held: "<player> has the fabled Spawn Cape and is at <x>, <y>, <z> in <world>. They have held it for <duration>."
  location-ground: "The Spawn Cape is at <x>, <y>, <z> in <world>."
  hint: "Type <yellow>/cape off</yellow> to hide cape messages, or <yellow>/cape help</yellow> for more info."
  muted: "You will no longer see Spawn Cape broadcasts."
  unmuted: "You will now see Spawn Cape broadcasts."
  reloaded: "Spawn Cape config reloaded."
  glide-mode: "Glide mode is <mode>."
  glide-set: "Glide mode set to <mode>."
  glide-usage: "Usage: /cape glide <force|jump|assist>"
  no-permission: "You must be an operator to do that."
  returned: "The Spawn Cape returned to spawn."
  received: "You now hold the Spawn Cape."
  totem: "The Spawn Cape saved you like a totem."
  keepsake: "You earned a Spawn Cape Keepsake for holding it for <duration>."
  grace-restored: "The Spawn Cape returned to you after the restart."
  cannot-pickup: "You need an empty inventory slot to take the Spawn Cape."
  help:
    - "<gold><bold>Spawn Cape</bold></gold>"
    - "There is only one. It sits at spawn until someone picks it up."
    - "It locks into your offhand: fly like an elytra, right-click to boost without rockets, and gain +1 reach."
    - "Overworld: if any axis is outside -1000 to 1000, it returns to spawn."
    - "Nether: if any axis is outside -250 to 250, it returns to spawn."
    - "End and other worlds: you can enter, but the cape returns to overworld spawn."
    - "If you would die, it pops like a totem and your killer gets the cape. Void and /kill still kill you."
    - "Logout also returns it to spawn. A reboot gives you 5 minutes to rejoin and keep your hold time."
    - "Hold it long enough to earn a cosmetic Spawn Cape Keepsake for each milestone, once each."
    - "Every minute you hold it, you get 2 obsidian. Extra drops at your feet if your inventory is full."
    - "Its location is broadcast every 5 minutes while someone holds it."
    - "<yellow>/cape</yellow> — current location"
    - "<yellow>/cape off</yellow> — hide broadcasts"
    - "<yellow>/cape on</yellow> — show broadcasts again"
    - "<yellow>/cape help</yellow> — this info"
